<header class="topbar app-header">
  <nav class="container topbar-inner" aria-label="Main">
    <a class="home-link" href="{{ '/' | relative_url }}" title="More apps">
      {% include icon.html name="chevron-left" size=14 %}
      <span>Apps</span>
    </a>
    <a class="brand-link" href="{{ page.url | relative_url }}">
      <img class="brand-icon" src="{{ page.icon | relative_url }}" alt="" width="28" height="28">
      <span class="brand-name">{{ page.name }}</span>
    </a>
    <button type="button" class="nav-toggle" aria-controls="app-nav" aria-expanded="false" aria-label="Toggle navigation">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
        <path stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10" stroke-width="2" d="M4 7h22M4 15h22M4 23h22"/>
      </svg>
    </button>
    <div id="app-nav" class="nav-collapse">
      <ul class="nav-list">
        {%- comment -%} Fragment-only: these sections exist on the app page only. {%- endcomment %}
        <li><a class="nav-link" href="#screenshots">Screenshots</a></li>
        <li><a class="nav-link" href="#features">Features</a></li>
        <li><a class="nav-link" href="#support">Support</a></li>
        <li><a class="button button-small" href="{{ page.app_store_url }}" rel="noopener">Get the app</a></li>
      </ul>
    </div>
  </nav>
</header>
