{%- assign t = site.data.i18n[page.lang] -%}
{%- assign home = '/' | append: page.lang | append: '/' -%}
<header class="topbar site-header">
  <div class="container topbar-inner">
    <a class="back-link" href="{{ home | relative_url }}">
      {% include icon.html name="chevron-left" size=14 %}
      <span>{{ site.data.site.owner.name }}</span>
    </a>
    <nav aria-label="{{ t.nav_main }}">
      <ul class="topbar-links">
        <li><a class="nav-link" href="{{ home | relative_url }}">{{ t.site_header.apps }}</a></li>
        <li><a class="nav-link" href="{{ home | append: '#contact' | relative_url }}">{{ t.site_header.contact }}</a></li>
      </ul>
    </nav>
  </div>
</header>
