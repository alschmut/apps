# Site settings. The content lives in data/: site.yml (owner, contact, legal, languages), i18n/<code>.yml
# (the texts of the templates in each language), and per language <code>/apps/<id>.md (one file per app)
# and one Markdown file per other page. engine/ turns it into the site.

title: Alexander Schmutz — Apps
description: >-
  Small, focused apps for iPhone, iPad and Apple Watch by Alexander Schmutz, an iOS developer in
  Stuttgart, Germany.

# The day of the build decides whether an app with a release_date is still up for pre-order.
timezone: Europe/Berlin

url: https://alschmut.github.io
# The site is served from https://alschmut.github.io/apps/.
# For a custom domain, emptying baseurl (baseurl: "") is all that is needed; add the domain to CNAME.
baseurl: /apps

# GitHub Pages applies jekyll-theme-primer by default; this site brings its own layouts and CSS.
theme: null

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: "apos,apos,quot,quot"

plugins:
  - jekyll-sitemap

# The engine's templates. Jekyll's default folder names start with an underscore.
layouts_dir: engine/layouts
includes_dir: engine/includes
data_dir: data

# Every page in data/<code>/ is in that language; every file in data/<code>/apps/ is an app page at
# /<code>/<file name>/. data/redirects/ holds the old paths without a language (/, /impressum/, …),
# which send the visitor to /en/ or /de/.
defaults:
  - scope:
      path: data/en
    values:
      lang: en
  - scope:
      path: data/de
    values:
      lang: de
  - scope:
      path: data/en/apps
    values:
      layout: app
      permalink: /en/:basename/
  - scope:
      path: data/de/apps
    values:
      layout: app
      permalink: /de/:basename/
  - scope:
      path: data/redirects
    values:
      layout: redirect
      sitemap: false
  - scope:
      path: data/404.md
    values:
      lang: en

# data/*.yml is read as site.data, not published. engine/ is published only for robots.txt.
exclude:
  - data/*.yml
  - data/i18n
  - engine/layouts
  - engine/includes
  - engine/scripts
  - README.md
  - CLAUDE.md
  - skills-lock.json
  - skills
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - CNAME
  - docs
  - vendor
  - node_modules
