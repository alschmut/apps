{%- assign data = site.data.site -%}
{%- comment -%} One line, the same on every page. {%- endcomment -%}
<footer class="site-footer">
  <div class="container site-footer-inner">
    <p class="footer-copy">© {{ data.copyright_year }} {{ data.owner.name }}</p>
    <nav class="footer-links" aria-label="Legal">
      {%- for link in data.legal.links %}
      <a href="{{ link.href | relative_url }}">{{ link.label }}</a>
      {%- endfor %}
    </nav>
  </div>
</footer>
