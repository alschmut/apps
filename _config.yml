# Site settings. The content lives in data/: site.yml (owner, contact, legal), apps/<id>.md (one file per
# app) and one Markdown file per other page. engine/ turns it into the site.

title: Alexander Schmutz — Apps
description: >-
  Small, focused apps for iPhone, iPad and Apple Watch by Alexander Schmutz, an iOS developer in
  Stuttgart, Germany.

url: https://alschmut.github.io
# The site is served from https://alschmut.github.io/apps/.
# For a custom domain, emptying baseurl (baseurl: "") is all that is needed; add the domain to CNAME.
baseurl: /apps

# GitHub Pages applies jekyll-theme-primer by default; this site brings its own layouts and CSS.
theme: null

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: "apos,apos,quot,quot"

plugins:
  - jekyll-sitemap

# The engine's templates. Jekyll's default folder names start with an underscore.
layouts_dir: engine/layouts
includes_dir: engine/includes
data_dir: data

# Every file in data/apps/ is an app page at /<file name>/.
defaults:
  - scope:
      path: data/apps
    values:
      layout: app
      permalink: /:basename/

# data/*.yml is read as site.data, not published. engine/ is published only for robots.txt.
exclude:
  - data/*.yml
  - engine/layouts
  - engine/includes
  - engine/scripts
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - CNAME
  - docs
  - vendor
  - node_modules
