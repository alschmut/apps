# What is the same in every language. The texts of each language are in data/i18n/<code>.yml.
owner:
  name: Alexander Schmutz
  portrait: /assets/images/portrait.jpg
contact:
  # The label of each channel is in data/i18n/<code>.yml under contact.labels.
  channels:
    - { id: email,    handle: apps@t-schmutz.de,  href: "mailto:apps@t-schmutz.de" }
    - { id: github,   handle: "@alschmut",        href: "https://github.com/alschmut" }
    - { id: linkedin, handle: alexander-schmutz,  href: "https://www.linkedin.com/in/alexander-schmutz" }
# Paths without the language; the templates put /en or /de in front. The labels are in
# data/i18n/<code>.yml under legal.
legal:
  links:
    - { id: impressum, href: /impressum/ }
    - { id: privacy,   href: /privacy-policy/ }
copyright_year: 2026
# Every language of the site, in the order of the language menus. Each one has its pages in
# data/<code>/ and its texts in data/i18n/<code>.yml. The first one is the fallback.
languages:
  - { code: en, name: English, locale: en_GB }
  - { code: de, name: Deutsch, locale: de_DE }
